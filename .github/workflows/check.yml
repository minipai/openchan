name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # A pull request checks out its merge into the current base; the first parent is that base.
          fetch-depth: 2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run checks
        run: bun run check

      # Lint the pull request's changed files against the same first-parent base used for its merge commit.
      - name: Lint changed files
        if: github.event_name == 'pull_request'
        # Against the merge's first parent, so base-branch commits the pull request has not merged are not counted as its
        # changes (the event's base SHA can predate them).
        run: bun run lint:changed HEAD^1
