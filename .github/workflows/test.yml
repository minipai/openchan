name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: shared package tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Run shared package tests
        run: bun turbo test --filter='!@opencode/app' --concurrency=3
      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated
      - name: Check generated OpenAPI
        working-directory: packages/protocol
        run: bun run check:generated

  app:
    name: app tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run app tests
        working-directory: packages/app
        run: bun run test

      - name: Build production app
        working-directory: packages/app
        run: bun run build
        env:
          VITE_OPENCODE_SERVER_MODE: none
          OPENCODE_CHANNEL: prod

  e2e:
    name: web integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Check E2E types
        working-directory: packages/app
        run: bun run typecheck:e2e
      - name: Install Chromium
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium
      - name: Run app E2E tests against a production build
        working-directory: packages/app
        run: bun run test:e2e:built
      - name: Check service-worker upgrades
        working-directory: packages/app
        run: bun run test:service-worker
      - name: Run session UI component tests
        working-directory: packages/session-ui
        run: bun run test:components
      - name: Run app component tests
        working-directory: packages/app
        run: bun run test:components
